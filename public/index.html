<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb Prompt Booker (Phase 0)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            max-width: 640px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #222;
            line-height: 1.5;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #555;
        }
        code {
            background: #f0f0f0;
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
            font-size: 0.9em;
        }
        .form label {
            display: block;
            margin-bottom: 1rem;
            font-weight: 600;
            color: #333;
        }
        .form label > select,
        .form label > input {
            display: block;
            margin-top: 0.25rem;
            width: 100%;
            box-sizing: border-box;
            padding: 0.5rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-weight: normal;
        }
        .book-button {
            display: inline-block;
            background: #FF385C;
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 0.5rem;
        }
        .book-button:hover {
            background: #E61E4D;
        }
        .book-disabled {
            color: #888;
            font-style: italic;
            padding: 0.5rem 0;
        }
        .error {
            color: #c00;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="elm.js"></script>
    <script>
        Elm.Main.init({ node: document.getElementById('app') });
    </script>
</body>
</html>
