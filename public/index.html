<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb Prompt Booker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            max-width: 640px;
            margin: 2rem auto;
            padding: 0 1rem;
            color: #222;
            line-height: 1.5;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #555;
        }
        code {
            background: #f0f0f0;
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
            font-size: 0.9em;
        }
        .form label {
            display: block;
            margin-bottom: 1rem;
            font-weight: 600;
            color: #333;
        }
        .form label > select,
        .form label > input,
        .form label > textarea {
            display: block;
            margin-top: 0.25rem;
            width: 100%;
            box-sizing: border-box;
            padding: 0.5rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-weight: normal;
            font-family: inherit;
        }
        .form label > textarea.prompt {
            resize: vertical;
            min-height: 4rem;
        }
        .examples {
            margin: 0.5rem 0 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            align-items: center;
        }
        .examples-label {
            color: #666;
            font-size: 0.9rem;
            margin-right: 0.25rem;
        }
        .example {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 16px;
            padding: 0.25rem 0.75rem;
            font-size: 0.85rem;
            cursor: pointer;
            color: #333;
            font-family: inherit;
        }
        .example:hover {
            background: #e8e8e8;
        }
        h2 {
            font-size: 0.8rem;
            margin-top: 1.75rem;
            margin-bottom: 0.5rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }
        .book-button {
            display: inline-block;
            background: #FF385C;
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 0.5rem;
        }
        .book-button:hover {
            background: #E61E4D;
        }
        .book-disabled {
            color: #888;
            font-style: italic;
            padding: 0.5rem 0;
        }
        .error {
            color: #c00;
        }
        .slm-banner {
            padding: 0.7rem 0.9rem;
            border-radius: 6px;
            font-size: 0.88rem;
            margin: 1rem 0;
            border: 1px solid;
            line-height: 1.4;
        }
        .slm-idle { background: #fafafa; color: #555; border-color: #e0e0e0; }
        .slm-loading { background: #fff7e6; color: #875c00; border-color: #ffd591; }
        .slm-ready { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
        .slm-error { background: #fef2f2; color: #991b1b; border-color: #fecaca; }
        .date-shift {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            margin: -0.5rem 0 1rem;
        }
        .tentative-hint {
            color: #875c00;
            font-size: 0.85rem;
            font-style: italic;
        }
        .slm-error-notice {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            border-radius: 6px;
            padding: 0.6rem 0.9rem;
            font-size: 0.85rem;
            margin: 0.5rem 0 1rem;
            line-height: 1.4;
        }
        .listing-section {
            margin-bottom: 1rem;
        }
        .no-match-notice {
            background: #fff7e6;
            color: #875c00;
            border: 1px solid #ffd591;
            border-radius: 6px;
            padding: 0.6rem 0.9rem;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }
        .listing-cards {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .listing-card {
            text-align: left;
            background: white;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            cursor: pointer;
            font-family: inherit;
            transition: border-color 0.12s, background 0.12s;
        }
        .listing-card:hover {
            border-color: #b0b0b0;
            background: #fafafa;
        }
        .listing-card.selected {
            border-color: #FF385C;
            background: #fff5f7;
        }
        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin: 0 0 0.25rem 0;
            color: #222;
        }
        .card-meta {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 0.15rem;
        }
        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-top: 0.5rem;
        }
        .tag-chip {
            background: #f0f0f0;
            color: #555;
            border-radius: 12px;
            padding: 0.1rem 0.55rem;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .listing-card.selected .tag-chip {
            background: #ffe1e8;
            color: #991b3a;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="elm.js"></script>
    <script type="module">
        import "./llm.js";
        import "./embed.js";

        const app = Elm.Main.init({ node: document.getElementById("app") });

        if (window.SlmBridge && app.ports && app.ports.slmInit) {
            app.ports.slmInit.subscribe((args) => SlmBridge.init(args));
            app.ports.slmGenerate.subscribe((args) => SlmBridge.generate(args));
            SlmBridge.on("status", (s) => app.ports.slmStatus.send(s));
            SlmBridge.on("response", (r) => app.ports.slmResponse.send(r));
        } else if (app.ports && app.ports.slmStatus) {
            app.ports.slmStatus.send({
                event: "error",
                message: "on-device runtime failed to load"
            });
        }

        if (window.EmbedBridge && app.ports && app.ports.embedRequest) {
            app.ports.embedRequest.subscribe((args) => EmbedBridge.embed(args));
            EmbedBridge.on("response", (r) => app.ports.embedResponse.send(r));
        } else if (app.ports && app.ports.embedResponse) {
            app.ports.embedResponse.send({
                id: -1,
                error: "embedding runtime failed to load"
            });
        }

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker
                .register("./sw.js")
                .catch((err) => console.warn("service worker registration failed:", err));
        }
    </script>
</body>
</html>
